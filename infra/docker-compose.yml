name: powerchain-crowdfunding

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-powerchain}
      POSTGRES_USER: ${POSTGRES_USER:-powerchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-powerchain_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - powerchain_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-powerchain} -d ${POSTGRES_DB:-powerchain}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [powerchain]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - powerchain_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    networks: [powerchain]

networks:
  powerchain:
    name: powerchain-crowdfunding-dev

volumes:
  powerchain_postgres:
  powerchain_redis:
