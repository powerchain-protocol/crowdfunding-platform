services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-powerchain}
      POSTGRES_USER: ${POSTGRES_USER:-powerchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-powerchain_local_only}
    ports: ["5432:5432"]
    volumes: ["powerchain_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-powerchain} -d ${POSTGRES_DB:-powerchain}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["powerchain_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  powerchain_postgres:
  powerchain_redis:
