packages:
  - "apps/*"
  - "packages/*"
  - "services/*"
  - "skills/*"

# pnpm v11 reads project settings from pnpm-workspace.yaml, not package.json#pnpm.
# Supply-chain maturity policy. pnpm v11 defaults to 24 hours; keep it explicit and strict.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExcludePrune: true
trustLockfile: false
blockExoticSubdeps: true

overrides:
  turbo: "2.10.10"
  next: "16.3.1"
  react: "19.2.8"
  react-dom: "19.2.8"
  "@types/node": "24.13.3"
  typescript: "6.0.3"
  tailwindcss: "4.3.3"
  "@tailwindcss/postcss": "4.3.3"
  postcss: "8.5.23"
  prisma: "6.19.3"
  "@prisma/client": "6.19.3"
  "@web3icons/react": "4.1.20"
  "@radix-ui/react-icons": "1.3.2"
  "@solana-commerce/connector": "0.1.0"
  stripe: "22.5.0"

# pnpm v11 replaced onlyBuiltDependencies with allowBuilds.
# Keep this list intentionally small: dependency install scripts run only for reviewed packages.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  sharp: true
